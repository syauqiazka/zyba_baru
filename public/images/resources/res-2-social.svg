<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CDE0D5"/>
      <stop offset="50%" stop-color="#E7EFE9"/>
      <stop offset="100%" stop-color="#FCEEE6"/>
    </linearGradient>
    <linearGradient id="sunGlow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F28C6E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D4B070"/>
      <stop offset="50%" stop-color="#8B9B78"/>
      <stop offset="100%" stop-color="#3E7B54"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Golden Sun Setting -->
  <circle cx="400" cy="220" r="140" fill="url(#sunGlow)"/>
  <circle cx="400" cy="220" r="60" fill="#FFF2DF"/>

  <!-- Distant Mountain Ridges -->
  <path d="M0,260 Q180,210 360,250 T800,240 L800,500 L0,500 Z" fill="#9FB5A6" opacity="0.45"/>
  <path d="M0,290 Q240,240 480,290 T800,280 L800,500 L0,500 Z" fill="#759480" opacity="0.6"/>

  <!-- Rolling Meadow Hills -->
  <path d="M0,330 Q200,280 440,340 T800,320 L800,500 L0,500 Z" fill="url(#fieldGrad)"/>

  <!-- Wild Grass & Wheat Texture in Foreground -->
  <g stroke="#C69E58" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <path d="M60,500 Q70,410 90,360"/>
    <path d="M80,500 Q100,420 130,370"/>
    <path d="M120,500 Q130,430 160,390"/>
    <path d="M220,500 Q230,400 270,350"/>
    <path d="M250,500 Q270,420 310,380"/>
    <path d="M520,500 Q540,410 570,360"/>
    <path d="M560,500 Q580,430 620,380"/>
    <path d="M680,500 Q700,390 740,340"/>
    <path d="M720,500 Q730,420 780,370"/>
  </g>
  <!-- Wheat Heads -->
  <g fill="#DDBB72">
    <ellipse cx="90" cy="360" rx="6" ry="16" transform="rotate(15 90 360)"/>
    <ellipse cx="130" cy="370" rx="6" ry="16" transform="rotate(20 130 370)"/>
    <ellipse cx="270" cy="350" rx="6" ry="16" transform="rotate(25 270 350)"/>
    <ellipse cx="570" cy="360" rx="6" ry="16" transform="rotate(20 570 360)"/>
    <ellipse cx="740" cy="340" rx="6" ry="16" transform="rotate(22 740 340)"/>
  </g>

  <!-- Solitary Minimalist Tree in Middle Ground -->
  <path d="M380,340 Q390,290 385,250 Q395,280 405,340 Z" fill="#423528"/>
  <ellipse cx="388" cy="235" rx="50" ry="35" fill="#3E7B54"/>
  <ellipse cx="370" cy="245" rx="40" ry="30" fill="#2E5C3E"/>
  <ellipse cx="405" cy="240" rx="42" ry="28" fill="#4B8C64"/>

  <!-- Warm Sunbeams Wash -->
  <polygon points="400,220 0,500 160,500" fill="#FFFFFF" opacity="0.12"/>
  <polygon points="400,220 640,500 800,500" fill="#FFFFFF" opacity="0.1"/>
</svg>