<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1713"/>
      <stop offset="50%" stop-color="#1B2B23"/>
      <stop offset="100%" stop-color="#2A3D33"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#FDE68A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1B2B23" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roomInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#243028"/>
      <stop offset="100%" stop-color="#161E1A"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F28C6E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#161E1A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="500" fill="url(#roomInterior)"/>

  <!-- Arched Minimalist Bedroom Window -->
  <path d="M120,380 L120,160 A160,160 0 0,1 440,160 L440,380 Z" fill="url(#nightSky)"/>
  <path d="M110,385 L110,155 A170,170 0 0,1 450,155 L450,385 Z" fill="none" stroke="#3A4A41" stroke-width="12"/>

  <!-- Stars in Night Window -->
  <circle cx="200" cy="90" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="260" cy="60" r="2" fill="#FFFFFF" opacity="0.9"/>
  <circle cx="340" cy="110" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="390" cy="70" r="2.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="160" cy="140" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="230" cy="160" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="370" cy="190" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="300" cy="220" r="1.5" fill="#FFFFFF" opacity="0.6"/>

  <!-- Glowing Crescent Moon -->
  <circle cx="320" cy="120" r="42" fill="url(#moonGlow)"/>
  <circle cx="320" cy="120" r="24" fill="#FEF3C7"/>
  <circle cx="330" cy="114" r="22" fill="#1B2B23"/>

  <!-- Window Sill & Hanging Ivy Vine -->
  <rect x="90" y="380" width="380" height="16" rx="4" fill="#3A4A41"/>
  <!-- Ivy tendrils hanging outside -->
  <path d="M140,160 Q125,230 135,280 Q120,320 130,360" stroke="#3E7B54" stroke-width="3" fill="none"/>
  <ellipse cx="130" cy="220" rx="8" ry="12" fill="#3E7B54" transform="rotate(-30 130 220)"/>
  <ellipse cx="140" cy="260" rx="9" ry="14" fill="#4B8C64" transform="rotate(25 140 260)"/>
  <ellipse cx="128" cy="310" rx="8" ry="12" fill="#2E5C3E" transform="rotate(-15 128 310)"/>

  <!-- Bedside Table with Ceramic Warm Lamp (Right Side) -->
  <rect x="520" y="270" width="180" height="230" rx="8" fill="#1C2420"/>
  <rect x="500" y="260" width="220" height="16" rx="4" fill="#29362F"/>

  <!-- Warm Table Lamp Glow -->
  <circle cx="610" cy="200" r="120" fill="url(#lampLight)"/>
  <!-- Lamp Shade -->
  <path d="M575,225 L645,225 L635,170 L585,170 Z" fill="#FDF6B2" opacity="0.95"/>
  <!-- Lamp Base -->
  <rect x="606" y="225" width="8" height="35" fill="#A8734A"/>
  <path d="M595,260 L625,260 L620,250 L600,250 Z" fill="#A8734A"/>

  <!-- Resting Book and Chamomile Tea Cup -->
  <rect x="530" y="252" width="45" height="8" rx="2" fill="#3E7B54"/>
  <rect x="528" y="246" width="40" height="7" rx="2" fill="#D4B070"/>
  <ellipse cx="655" cy="254" rx="14" ry="6" fill="#A4B3A8"/>
  <path d="M647,242 L663,242 L661,254 L649,254 Z" fill="#EAE3D2"/>
  <!-- Gentle Steam Vapor -->
  <path d="M653,238 Q650,230 655,224 T652,216" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>