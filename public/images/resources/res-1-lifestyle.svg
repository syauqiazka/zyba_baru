<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBE3D7"/>
      <stop offset="100%" stop-color="#DFD5C6"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7B563D"/>
      <stop offset="100%" stop-color="#553A26"/>
    </linearGradient>
    <linearGradient id="windowLight" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="fireplaceGlow" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#F28C6E" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E0724C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#553A26" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wall Background -->
  <rect width="800" height="500" fill="url(#bgGrad1)"/>

  <!-- Timber Ceiling Beams -->
  <rect x="0" y="0" width="800" height="32" fill="#5A3E2B"/>
  <rect x="180" y="0" width="40" height="500" fill="#5A3E2B" opacity="0.08"/>
  <rect x="420" y="0" width="40" height="500" fill="#5A3E2B" opacity="0.08"/>
  <rect x="660" y="0" width="40" height="500" fill="#5A3E2B" opacity="0.08"/>

  <!-- Left Window with Soft Daylight -->
  <rect x="50" y="60" width="180" height="280" rx="8" fill="#D3E0D8"/>
  <rect x="55" y="65" width="80" height="130" fill="url(#windowLight)"/>
  <rect x="145" y="65" width="80" height="130" fill="url(#windowLight)"/>
  <rect x="55" y="205" width="80" height="130" fill="url(#windowLight)"/>
  <rect x="145" y="205" width="80" height="130" fill="url(#windowLight)"/>
  <!-- Window Frame -->
  <rect x="46" y="56" width="188" height="288" rx="8" fill="none" stroke="#FFFFFF" stroke-width="8"/>
  <line x1="140" y1="60" x2="140" y2="340" stroke="#FFFFFF" stroke-width="6"/>
  <line x1="50" y1="200" x2="230" y2="200" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Floor: Warm Polished Wood Planks -->
  <path d="M0,380 L800,380 L800,500 L0,500 Z" fill="#916B4D"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#7A563A" stroke-width="2"/>
  <line x1="0" y1="445" x2="800" y2="445" stroke="#7A563A" stroke-width="2"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#7A563A" stroke-width="2"/>

  <!-- Fireplace Mantel in Center/Right -->
  <rect x="360" y="160" width="280" height="220" rx="6" fill="#3D3631"/>
  <rect x="340" y="145" width="320" height="20" rx="4" fill="#24201D"/>
  <rect x="410" y="230" width="180" height="150" rx="16" fill="#1C1815"/>
  <!-- Fireplace Hearth Glow -->
  <circle cx="500" cy="350" r="75" fill="url(#fireplaceGlow)"/>
  <path d="M470,360 Q500,290 515,335 Q530,310 535,360 Z" fill="#F28C6E"/>
  <path d="M485,360 Q500,320 510,345 Q515,330 520,360 Z" fill="#FDE047"/>

  <!-- Cozy Wooden Armchair with Linen Cushion -->
  <rect x="230" y="270" width="24" height="90" rx="6" fill="url(#woodGrad)"/>
  <rect x="310" y="270" width="24" height="90" rx="6" fill="url(#woodGrad)"/>
  <path d="M220,310 Q280,305 340,310 L340,350 Q280,355 220,350 Z" fill="#E2D7C5"/>
  <rect x="235" y="340" width="14" height="60" fill="url(#woodGrad)"/>
  <rect x="315" y="340" width="14" height="60" fill="url(#woodGrad)"/>

  <!-- Round Slate Coffee Table with Tea Pot -->
  <ellipse cx="440" cy="420" rx="100" ry="40" fill="#2B3630"/>
  <ellipse cx="440" cy="415" rx="96" ry="36" fill="#3A4840"/>
  <path d="M425,385 L445,385 L442,402 L428,402 Z" fill="#EAE3D2"/>
  <circle cx="435" cy="380" r="6" fill="#EAE3D2"/>
  <ellipse cx="455" cy="398" rx="8" ry="4" fill="#EAE3D2"/>

  <!-- Indoor Plant in Ceramic Pot -->
  <ellipse cx="690" cy="420" rx="35" ry="16" fill="#222"/>
  <path d="M665,340 L715,340 L705,420 L675,420 Z" fill="#D87A5B"/>
  <!-- Botanical Monstera / Ficus Leaves -->
  <path d="M690,340 Q650,260 620,290 Q650,320 690,340 Z" fill="#3E7B54"/>
  <path d="M690,330 Q720,240 760,270 Q730,310 690,330 Z" fill="#2D5E3F"/>
  <path d="M690,320 Q690,210 710,230 Q700,280 690,320 Z" fill="#4E9969"/>

  <!-- Ambient Light Wash Overlay -->
  <polygon points="140,60 480,480 340,480 50,200" fill="#FFFFFF" opacity="0.08"/>
</svg>