name: Automated Wellness Articles Sync

on:
  schedule:
    # Berjalan setiap 6 jam (00:00, 06:00, 12:00, 18:00 UTC) - 100% GRATIS di GitHub Actions
    - cron: '0 */6 * * *'
  workflow_dispatch: # Memungkinkan trigger manual lewat tab Actions di GitHub

jobs:
  sync-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ZYBA Article Ingestion
        run: |
          curl -X POST "${{ secrets.ZYBA_APP_URL || 'https://zyba.my.id' }}/api/cron/sync-articles" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET || 'zyba-cron-sync-wellness-key-2026' }}" \
            --fail --silent --show-error
